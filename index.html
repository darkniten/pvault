<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Особиста бібліотека промптів.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Prompt Vault — Бібліотека промптів</title>
  <link rel="icon" href="assets/icon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png?v=3">
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="stylesheet" href="assets/vault.css?v=3">
  <script defer src="js/core.js?v=3"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/sync.js"></script>
  <script defer src="js/app.js?v=3"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a href="#all" class="brand"><img src="assets/icon.svg?v=3" width="36" height="36" alt=""><span>Prompt Vault</span></a>
        <div class="top-actions">
          <button class="sync-control" id="sync-control" data-action="sync-settings" aria-label="Стан синхронізації"></button>
          <button class="primary top-create" data-action="new-prompt" aria-label="Новий промпт"><span class="plus-symbol"></span><span>Новий промпт</span></button>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div class="skeleton"><div></div><div></div><div></div></div>
    </main>
    <nav id="bottom-nav" class="bottom-nav glass" aria-label="Основна навігація"></nav>
  </div>
  <dialog id="editor" class="editor glass" aria-labelledby="editor-label"></dialog>
  <dialog id="modal" class="modal glass" aria-labelledby="modal-label"></dialog>
  <dialog id="menu" class="context glass" aria-label="Дії"></dialog>
  <div id="toast" class="toast glass" role="status" aria-live="polite"></div>
  <noscript>Увімкніть JavaScript, щоб відкрити Prompt Vault.</noscript>
</body>
</html>
